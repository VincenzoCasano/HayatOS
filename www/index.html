<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>HayatOS — Your Personal Operating System</title>
<meta name="description" content="HayatOS — a premium all-in-one productivity operating system. Tasks, prayer tracking, study timers, journaling, and more — synced across every device." />

<!-- PWA (installable on desktop Chrome/Edge and mobile browsers) -->
<meta name="theme-color" content="#0A0203" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="HayatOS" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/icon-192.png" />

<!-- Same design system as the Android app -->
<link rel="stylesheet" href="./hayat.css" />

<!-- React + ReactDOM + lucide-react + Firebase + Capacitor plugins (all running their
     browser/"web" implementations here — Capacitor detects there's no native runtime and
     each plugin falls back to real browser APIs, e.g. Firebase Auth/Firestore use the
     actual Firebase Web SDK, Haptics uses the Vibration API, etc.) are pre-bundled locally
     into app.bundle.js by esbuild (see build.mjs / `npm run build`). Run `npm run build`
     after every www/app.jsx change, before deploying. -->
</head>
<body style="margin:0;">
<div id="root">
  <div class="hy-loading">
    <div class="hy-loading-card">
      <div class="hy-loading-icon">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </div>
      <div class="hy-loading-title">HayatOS</div>
      <div class="hy-loading-spinner"></div>
    </div>
  </div>
</div>
<style>
  .hy-loading { min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:system-ui,sans-serif; background: radial-gradient(120% 100% at 50% 20%,#1a0d0a,#0A0203); }
  .hy-loading-card { display:flex; flex-direction:column; align-items:center; gap:16px; padding:34px 44px; border-radius:28px;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.20); border-top-color: rgba(255,255,255,.45); border-top-width: 1px; border-top-style: solid;
    -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.35), 0 12px 28px rgba(0,0,0,.3); }
  .hy-loading-icon { width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#E2543F,#8A1506);box-shadow:0 8px 30px rgba(226,84,63,.35);display:flex;align-items:center;justify-content:center;animation:hy-breathe 2.2s ease-in-out infinite; }
  .hy-loading-title { font-weight:800;letter-spacing:-0.02em;font-size:15px; color:#F6ECE4; }
  .hy-loading-spinner { width:34px;height:34px;border-radius:50%;border:3px solid rgba(246,236,228,.15);border-top-color:#E2543F;animation:hy-spin 900ms linear infinite; }
  @keyframes hy-breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.85;transform:scale(.94)}}
  @keyframes hy-spin{to{transform:rotate(360deg)}}
  @media (prefers-color-scheme: light) {
    .hy-loading { background: radial-gradient(120% 100% at 50% 20%,#FBF3E4,#F1E6D2); }
    .hy-loading-card { background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.42)); border-color: rgba(90,60,30,.18); border-top-color: rgba(255,255,255,.85); box-shadow: inset 0 1px 1px rgba(255,255,255,.75), 0 12px 28px rgba(90,60,30,.15); }
    .hy-loading-title { color:#221A12; }
    .hy-loading-spinner { border-color: rgba(90,60,30,.15); border-top-color:#B5813B; }
  }
</style>

<script type="module" src="./app.bundle.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'none' })
        .then((reg) => reg.update().catch(() => {}))
        .catch(() => {});
    });
  }
</script>
</body>
</html>
